name: Release

on:
  push:
    branches: [main]
    paths-ignore:           # the product page deploys on its own (pages.yml)
      - "site/**"
      - "scripts/site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:        # manual run from any branch (native ref picker)

concurrency:
  # per-ref: a manual branch build won't serialize behind / block a main release
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write           # for gh release create

jobs:
  release:
    name: Build & release
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0     # required: git rev-list --count needs full history

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine version
        id: version
        run: |
          COUNT=$(git rev-list HEAD --first-parent --count)
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="0.${COUNT}"
            PRERELEASE=false
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            SLUG=$(printf '%s' "${GITHUB_REF_NAME}" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -c 'a-z0-9' '-' \
              | sed -E 's/^-+|-+$//g')
            VERSION="0.${COUNT}-${SLUG}.${SHORT_SHA}"
            PRERELEASE=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: ${VERSION} (prerelease=${PRERELEASE})"

      - name: Run tests
        if: steps.version.outputs.skip != 'true'
        run: swift test

      - name: Import signing identity
        # A stable self-signed "Link Router Release" identity (private key in
        # repo secrets, public cert in scripts/release-cert.pem). Unlike ad-hoc
        # signing, it keeps the app's code-signing identity constant across
        # releases, so macOS keeps the Accessibility grant after updates.
        # Without the secret (forks), bundle.sh falls back to ad-hoc.
        if: steps.version.outputs.skip != 'true' && env.P12 != ''
        env:
          P12: ${{ secrets.LINKROUTER_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.LINKROUTER_SIGNING_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/release.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain scripts/release-cert.pem
          security find-identity -p codesigning -v
          echo "LINKROUTER_SIGN_IDENTITY=Link Router Release" >> "$GITHUB_ENV"

      - name: Build & bundle
        if: steps.version.outputs.skip != 'true'
        env:
          LINKROUTER_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bundle.sh

      - name: Verify signature
        if: steps.version.outputs.skip != 'true'
        run: codesign -dvv "Link Router.app" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier" || true

      - name: Package DMG
        if: steps.version.outputs.skip != 'true'
        env:
          LINKROUTER_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git log -1 --pretty=%B > release-notes.txt
          PRERELEASE_FLAG=""
          [ "${PRERELEASE}" = "true" ] && PRERELEASE_FLAG="--prerelease"
          gh release create "${VERSION}" LinkRouter-*.dmg \
            --title "Link Router ${VERSION}" \
            --notes-file release-notes.txt \
            --target "${GITHUB_SHA}" \
            ${PRERELEASE_FLAG}
